<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="net-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="100%" stop-color="#0E1626" />
    </linearGradient>
    <linearGradient id="layer-grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="layer-grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="layer-grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
    <linearGradient id="out-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" fill="url(#net-bg)" rx="16" />
  <rect width="998" height="518" x="1" y="1" fill="none" stroke="rgba(255, 255, 255, 0.08)" rx="16" />

  <!-- Title -->
  <text x="50" y="45" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">
    DEEP RESIDUAL MLP (RES-MLP) NEURAL GATEKEEPER
  </text>
  <text x="50" y="70" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    15-Feature Tabular Input with Linear Skip Projection &amp; Binary Focal Loss
  </text>

  <!-- Block 1: 15 Features -->
  <g transform="translate(40, 110)">
    <rect width="160" height="340" rx="10" fill="#0D1525" stroke="rgba(255, 255, 255, 0.1)" filter="url(#box-shadow)" />
    <rect width="160" height="35" rx="10" fill="rgba(255, 255, 255, 0.04)" />
    <text x="80" y="23" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">15 QUANT FEATURES</text>
    
    <text x="15" y="65" fill="#94A3B8" font-family="monospace" font-size="11">• Vol Breakout Ratio</text>
    <text x="15" y="90" fill="#94A3B8" font-family="monospace" font-size="11">• FVG Depth %</text>
    <text x="15" y="115" fill="#94A3B8" font-family="monospace" font-size="11">• Tokyo Range Pct</text>
    <text x="15" y="140" fill="#94A3B8" font-family="monospace" font-size="11">• HTF 1h Alignment</text>
    <text x="15" y="165" fill="#94A3B8" font-family="monospace" font-size="11">• HTF 4h Alignment</text>
    <text x="15" y="190" fill="#94A3B8" font-family="monospace" font-size="11">• ATR 14 Normalized</text>
    <text x="15" y="215" fill="#94A3B8" font-family="monospace" font-size="11">• Dist to Asian High</text>
    <text x="15" y="240" fill="#94A3B8" font-family="monospace" font-size="11">• Dist to Asian Low</text>
    <text x="15" y="265" fill="#94A3B8" font-family="monospace" font-size="11">• Candle Body Ratio</text>
    <text x="15" y="290" fill="#94A3B8" font-family="monospace" font-size="11">• RSI 14 Momentum</text>
    <text x="15" y="315" fill="#94A3B8" font-family="monospace" font-size="11">• QM Sweep Flag</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 200 280 L 250 280" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="4 2" />
  <polygon points="255,280 247,276 247,284" fill="#3B82F6" />

  <!-- Block 2: Layer 1 (Dense 64) -->
  <g transform="translate(260, 150)">
    <rect width="160" height="260" rx="10" fill="#0D1525" stroke="#3B82F6" stroke-width="1.5" filter="url(#box-shadow)" />
    <rect width="160" height="35" rx="10" fill="url(#layer-grad1)" />
    <text x="80" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">LAYER 1 (DENSE 64)</text>

    <text x="15" y="70" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">Linear (15 → 64)</text>
    <text x="15" y="105" fill="#94A3B8" font-family="sans-serif" font-size="11">LayerNorm (64)</text>
    <text x="15" y="140" fill="#94A3B8" font-family="sans-serif" font-size="11">LeakyReLU (α = 0.1)</text>
    <text x="15" y="175" fill="#F87171" font-family="sans-serif" font-size="11" font-weight="600">Dropout (p = 0.30)</text>

    <rect x="15" y="205" width="130" height="35" rx="6" fill="rgba(59, 130, 246, 0.15)" />
    <text x="80" y="227" fill="#60A5FA" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">High-Dim Projection</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 420 280 L 470 280" stroke="#8B5CF6" stroke-width="2.5" />
  <polygon points="475,280 467,276 467,284" fill="#8B5CF6" />

  <!-- Skip Connection Path (From Layer 1 over to Projection) -->
  <path d="M 340 150 L 340 100 L 720 100 L 720 200" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6 3" />
  <polygon points="720,205 716,197 724,197" fill="#F59E0B" />
  <rect x="480" y="85" width="150" height="24" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
  <text x="555" y="101" fill="#FBBF24" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">RESIDUAL SKIP CONNECTION</text>

  <!-- Block 3: Layer 2 (Dense 32) -->
  <g transform="translate(480, 170)">
    <rect width="155" height="220" rx="10" fill="#0D1525" stroke="#8B5CF6" stroke-width="1.5" filter="url(#box-shadow)" />
    <rect width="155" height="35" rx="10" fill="url(#layer-grad2)" />
    <text x="77" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">LAYER 2 (DENSE 32)</text>

    <text x="15" y="70" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">Linear (64 → 32)</text>
    <text x="15" y="105" fill="#94A3B8" font-family="sans-serif" font-size="11">LayerNorm (32)</text>
    <text x="15" y="140" fill="#94A3B8" font-family="sans-serif" font-size="11">LeakyReLU (α = 0.1)</text>
    <text x="15" y="175" fill="#F87171" font-family="sans-serif" font-size="11" font-weight="600">Dropout (p = 0.20)</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 635 280 L 675 280" stroke="#EC4899" stroke-width="2.5" />
  <polygon points="680,280 672,276 672,284" fill="#EC4899" />

  <!-- Block 4: Residual Add & Projection (Dense 16) -->
  <g transform="translate(680, 205)">
    <rect width="140" height="150" rx="10" fill="#0D1525" stroke="#EC4899" stroke-width="1.5" filter="url(#box-shadow)" />
    <rect width="140" height="35" rx="10" fill="url(#layer-grad3)" />
    <text x="70" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">PROJECTION (16)</text>

    <text x="12" y="65" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="600">Add (32 + 64)</text>
    <text x="12" y="90" fill="#94A3B8" font-family="sans-serif" font-size="11">Linear → 16</text>
    <text x="12" y="115" fill="#94A3B8" font-family="sans-serif" font-size="11">LeakyReLU</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 820 280 L 850 280" stroke="#10B981" stroke-width="2.5" />
  <polygon points="855,280 847,276 847,284" fill="#10B981" />

  <!-- Block 5: Output Head -->
  <g transform="translate(855, 190)">
    <rect width="115" height="180" rx="10" fill="#0D1525" stroke="#10B981" stroke-width="2" filter="url(#box-shadow)" />
    <rect width="115" height="35" rx="10" fill="url(#out-grad)" />
    <text x="57" y="23" fill="#064E3B" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">OUTPUT</text>

    <text x="10" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600">Linear (16 → 1)</text>
    <text x="10" y="90" fill="#34D399" font-family="sans-serif" font-size="11">Sigmoid σ(z)</text>
    
    <line x1="10" y1="105" x2="105" y2="105" stroke="rgba(255,255,255,0.1)" />

    <text x="10" y="125" fill="#A7F3D0" font-family="sans-serif" font-size="10" font-weight="700">P(Win) ≥ 0.65</text>
    <rect x="10" y="135" width="95" height="25" rx="5" fill="rgba(16, 185, 129, 0.2)" />
    <text x="57" y="152" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">TRADE EXEC</text>
  </g>

  <!-- Footer Specs -->
  <g transform="translate(50, 475)">
    <text x="0" y="15" fill="#64748B" font-family="sans-serif" font-size="12">
      <tspan fill="#E2E8F0" font-weight="bold">Loss:</tspan> Binary Focal Loss (α=0.55, γ=2.0)  |  
      <tspan fill="#E2E8F0" font-weight="bold">Optimizer:</tspan> AdamW (lr=0.001, wd=0.01)  |  
      <tspan fill="#E2E8F0" font-weight="bold">Training Data:</tspan> 1,401,860 15m Candles (10 Top Assets, 2021-2026)
    </text>
  </g>
</svg>