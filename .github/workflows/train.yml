name: Automated Multi-Year Training & Backtest

on:
  workflow_dispatch:
    inputs:
      pipeline_mode:
        description: 'Pipeline Mode (multi_asset / single_btc)'
        required: true
        default: 'multi_asset'
      start_year:
        description: 'Start Year for Historical Data'
        required: true
        default: '2018'
      end_year:
        description: 'End Year for Historical Data'
        required: true
        default: '2026'

jobs:
  train_and_backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PyTorch & Computing Stack
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy pandas

      - name: Ingest Market Archives & Run Quant Backtest (4.75M Candles)
        run: |
          if [ "${{ github.event.inputs.pipeline_mode }}" = "single_btc" ]; then
            python multi_year_backtest.py ${{ github.event.inputs.start_year || '2018' }} ${{ github.event.inputs.end_year || '2026' }}
          else
            python multi_asset_pipeline.py
          fi

      - name: Train PyTorch Deep Res-MLP on Extracted Feature Matrix
        run: |
          python pipeline_train.py

      - name: Commit and Push Training Artifacts & Report
        run: |
          git config user.name "ShiTmoZ"
          git config user.email "ShiTmoZ@users.noreply.github.com"
          git add BACKTEST_REPORT.md trades_backtest.json multi_asset_trades.json best_model.pt ml_weights.json res_mlp_weights.json README.md || true
          git commit -m "chore(ml): update multi-asset backtest artifacts [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
